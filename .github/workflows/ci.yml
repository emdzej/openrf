name: CI

# Builds the app and every test binary, and the gasm module openrf.wasm, on each push / PR.
# The tests need the original game data (not redistributable), so CI only
# compiles them; run them locally with the extracted CD in ./cd.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: install dependencies
        run: brew install sdl3

      - name: configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: build (app + tests)
        run: cmake --build build -j

      - name: check Python tools compile
        run: python3 -m py_compile tools/*.py

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: fetch wasi-sdk and the gasm C SDK
        run: tools/fetch-gasm-sdk.sh

      - name: configure (gasm)
        run: >-
          cmake -S . -B build-gasm -DOPENRF_PLATFORM=gasm -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=.deps/gasm-c-sdk/cmake/gasm-toolchain.cmake
          -DWASI_SDK_PREFIX="$PWD/.deps/wasi-sdk"

      - name: build openrf.wasm
        run: |
          cmake --build build-gasm -j
          ls -l build-gasm/openrf.wasm

      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: openrf-wasm
          path: build-gasm/openrf.wasm
          retention-days: 14
