name: Release

# Triggered by plain semver tags (no "v" prefix): `git tag 0.1.0 && git push origin 0.1.0`.
# Builds a universal (arm64 + x86_64) Return Fire.app with SDL3 linked
# statically and the gasm module openrf-<version>.wasm, and attaches both (with
# SHA-256 files) to a GitHub Release.

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Build artifacts only, no GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write   # to create the Release and upload assets

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v="$GITHUB_REF_NAME"; else v="0.0.0-snapshot.${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: configure (universal, bundled SDL3)
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DOPENRF_BUNDLED_SDL=ON
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: build
        run: cmake --build build -j --target openrf

      - name: package
        id: pkg
        run: |
          app="build/Return Fire.app"
          lipo -info "$app/Contents/MacOS/Return Fire"
          # Fail if anything outside the OS is linked (the .app must be self-contained).
          # (dependency lines are indented; the per-architecture headers of a fat binary are not)
          if otool -L "$app/Contents/MacOS/Return Fire" | grep -E '^\s' | grep -vE '^\s*(/usr/lib/|/System/)'; then
            echo "unexpected non-system library dependency"; exit 1
          fi
          codesign --force --deep --sign - "$app"   # ad-hoc signature (not notarized)
          name="OpenRF-${{ steps.ver.outputs.version }}-macos-universal.zip"
          ditto -c -k --keepParent "$app" "$name"
          shasum -a 256 "$name" > "$name.sha256"
          echo "zip=$name" >> "$GITHUB_OUTPUT"

      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: openrf-macos-universal
          path: OpenRF-*.zip*
          retention-days: 14

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v="$GITHUB_REF_NAME"; else v="0.0.0-snapshot.${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # SDK version: GASM_VERSION in tools/fetch-gasm-sdk.sh (see the note there).
      - name: fetch wasi-sdk and the gasm C SDK
        run: tools/fetch-gasm-sdk.sh

      - name: build openrf.wasm
        run: |
          cmake -S . -B build-gasm -DOPENRF_PLATFORM=gasm -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=.deps/gasm-c-sdk/cmake/gasm-toolchain.cmake -DWASI_SDK_PREFIX="$PWD/.deps/wasi-sdk"
          cmake --build build-gasm -j
          name="openrf-${{ steps.ver.outputs.version }}.wasm"
          cp build-gasm/openrf.wasm "$name"
          sha256sum "$name" > "$name.sha256"
          ls -l "$name"

      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: openrf-wasm
          path: openrf-*.wasm*
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME" artifacts/*
          --title "OpenRF $GITHUB_REF_NAME"
          --generate-notes
          --notes-file .github/release-notes.md
