<svg xmlns="http://www.w3.org/2000/svg" width="128" height="20" viewBox="0 0 128 20" role="img" aria-label="built with gasm">
  <title>built with gasm</title>
  <!-- Temporary; replace with gasm's official badge when published. -->
  <!-- Logo mark: gasm's favicon (MIT, github.com/emdzej/gasm), redrawn on a 16 px pixel grid. -->
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="r"><rect width="128" height="20" rx="3"/></clipPath>
  <g clip-path="url(#r)">
    <rect width="86" height="20" fill="#30363f"/>
    <rect x="86" width="42" height="20" fill="#3f8ea3"/>
    <rect width="128" height="20" fill="url(#s)"/>
  </g>
  <g shape-rendering="crispEdges">
    <rect x="4" y="2" width="16" height="16" rx="3.5" fill="#0e1116" shape-rendering="auto"/>
    <g fill="#3a4250"><rect x="11" y="4" width="1" height="2"/><rect x="11" y="7" width="1" height="2"/><rect x="11" y="10" width="1" height="2"/><rect x="11" y="13" width="1" height="2"/></g>
    <rect x="6" y="6" width="2" height="5" fill="#e8554e"/>
    <rect x="16" y="9" width="2" height="5" fill="#3b7ff5"/>
    <rect x="13" y="7" width="2" height="2" fill="#f2f4f8"/>
  </g>
  <g fill="#fff" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11" text-rendering="geometricPrecision">
    <text x="24" y="15" fill="#010101" fill-opacity=".3" textLength="56" lengthAdjust="spacingAndGlyphs">built with</text>
    <text x="24" y="14" textLength="56" lengthAdjust="spacingAndGlyphs">built with</text>
    <text x="92" y="15" fill="#010101" fill-opacity=".3" textLength="30" lengthAdjust="spacingAndGlyphs">gasm</text>
    <text x="92" y="14" textLength="30" lengthAdjust="spacingAndGlyphs">gasm</text>
  </g>
</svg>
